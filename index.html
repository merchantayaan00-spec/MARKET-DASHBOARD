<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<title>Market Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a' stroke='%23f5f5f5' stroke-width='3'/%3E%3Cpath d='M5 22l7-8 5 4 10-11' stroke='%2300e676' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="bar">
  <nav class="seg" id="seg" role="tablist" aria-label="View" data-active="today">
    <span class="thumb" aria-hidden="true"></span>
    <button role="tab" id="tab-today" data-tab="today" aria-selected="true" aria-controls="view-today" title="Today (1)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Today</span></button>
    <button role="tab" id="tab-charts" data-tab="charts" aria-selected="false" aria-controls="view-charts" title="Charts (2)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Charts</span></button>
  </nav>
  <div class="status" aria-live="polite">
    <span class="lg" title="Fill shows the size of the move: big = 1.5% or more, medium = 0.5% to 1.5%, small = under 0.5%. Green is good, red is bad."><span><i class="s2"></i>Solid = big move</span><span><i class="s1"></i>Tint = medium</span><span><i class="s0"></i>Outline = small</span></span>
    <span class="mkt" id="mkt"><i></i><b>&ndash;</b></span>
    <span id="upd">Updated &ndash;</span>
    <span id="nxt">Next &ndash;</span>
  </div>
</header>

<div class="view" id="view-today">
  <main class="grid">
    <section class="panel p-markets"><div class="ph">Markets</div>
      <div class="pb"><div class="tiles two" id="indices"></div><div class="heat" id="sectors"></div></div></section>
    <section class="panel p-risk"><div class="ph">Risk</div><div class="pb"><div class="tiles one" id="risk-grid"></div></div></section>
    <section class="panel p-rates"><div class="ph">Rates</div><div class="pb"><div class="tiles rates" id="rates-grid"></div></div></section>
    <section class="panel p-consumer"><div class="ph">Consumer</div><div class="pb"><div class="tiles cons" id="consumer-grid"></div></div></section>
    <section class="panel p-news"><div class="ph">Headlines</div><div class="pb" id="headline-list"></div></section>
    <section class="panel p-deals"><div class="ph">Deals <span class="meta" id="deals-meta"></span></div><div class="pb"><div class="deals" id="deal-list"></div></div></section>
  </main>
</div>

<div class="view" id="view-charts" hidden>
  <main class="cgrid" id="chart-grid"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
